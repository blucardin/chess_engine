name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build job
  build:
    # Specify runner +  build & upload the static files as an artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
#        with:
#          submodules: true  # Fetch Hugo themes (true OR recursive)
#          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

#      - uses: actions/setup-node@v4
#        with:
#          node-version: 23
#      - run: npm update
#      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build chess_gui into WASM
        id: build
        run: cargo build -p chess_gui --release --target wasm32-unknown-unknown --verbose

          # look ino making this just npm install && npm run build

          # <Not provided for brevity>
          # At a minimum this step should build the static files of your site
        # <Not provided for brevity>

#      - run: cp CNAME dist/
      - name: Generate JS for WASM
        id: wasmbindgen
        run: wasm-bindgen --no-typescript --target web --out-dir ./out/ --out-name "chess_gui" ./target/wasm32-unknown-unknown/release/chess_gui.wasm


      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3 # or specific "vX.X.X" version tag for this action
        with:
          path: out/

  # Deployment job
  deploy:
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
